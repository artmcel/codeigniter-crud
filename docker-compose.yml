services:
  frontend:
    build: ./src/frontend
    ports:
      - "3090:80"
    volumes:
      - ./src/frontend/src:/var/www
    depends_on:
      - db

  db:
    image: mariadb:latest
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: prueba
      MYSQL_USER: prueba
      MYSQL_PASSWORD: prueba
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data: